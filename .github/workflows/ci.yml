name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # smoke.mjs shells `npm run build` itself (prebuild regenerates
      # chapters.json, then next build runs) and asserts on the build log,
      # .next/BUILD_ID, chapters.json (26) and problems.json (≥1).
      - name: Build + smoke test
        run: node tests/smoke.mjs

      # Guarantees the committed chapters.json is exactly what the generator
      # would produce — run after the smoke build rewrote/verified it.
      - name: Manifesto chapters are committed fresh
        run: node scripts/split-manifesto.mjs --check