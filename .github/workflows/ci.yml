name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check JavaScript (node --check)
        run: |
          for f in js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Static checks (HTML balance, ids, links, shared markers)
        run: python3 tests/static_check.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Start local static server
        run: |
          nohup python3 -m http.server 8000 >/tmp/http-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null; then
              echo "server ready"
              break
            fi
            sleep 0.5
          done

      - name: Run smoke tests (Playwright)
        run: python3 tests/smoke.py
        env:
          BASE_URL: http://127.0.0.1:8000
