name: Deploy to Cloudflare Workers

# Production deploy: builds the Next.js app into a Workers bundle with OpenNext
# and publishes it with wrangler. GitHub Pages is retired — this is the only
# deploy path. D1 schema is (re)applied idempotently, and worker secrets are
# (re)set, so an environment converges on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy
    # Skip (not fail) until the owner sets the CF_API_TOKEN repo secret so the
    # branch stays green; a notice explains what's missing (see README §10).
    if: ${{ secrets.CF_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # opennextjs-cloudflare build runs `next build` internally and bundles
      # the result into .open-next/worker.js (see wrangler.toml `main`).
      - name: Build worker (OpenNext)
        run: npx opennextjs-cloudflare build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # Secrets go after the first deploy so the worker exists. Idempotent;
      # missing secrets warn instead of failing (the admin panel falls back to
      # "open mode" and Discord delivery is a no-op until webhooks are set).
      - name: Set worker secrets (idempotent)
        run: |
          set -euo pipefail
          if [ -n "$DISCORD_APPLY_WEBHOOK" ]; then
            printf '%s' "$DISCORD_APPLY_WEBHOOK" | npx wrangler secret put DISCORD_APPLY_WEBHOOK \
              || echo "::warning::failed to set DISCORD_APPLY_WEBHOOK"
          else
            echo "::warning::DISCORD_APPLY_WEBHOOK secret not set — skipping"
          fi

          if [ -n "$DISCORD_PROBLEMS_WEBHOOK" ]; then
            printf '%s' "$DISCORD_PROBLEMS_WEBHOOK" | npx wrangler secret put DISCORD_PROBLEMS_WEBHOOK \
              || echo "::warning::failed to set DISCORD_PROBLEMS_WEBHOOK"
          else
            echo "::warning::DISCORD_PROBLEMS_WEBHOOK secret not set — skipping"
          fi

          if [ -n "$ADMIN_TOKEN" ]; then
            printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN \
              || echo "::warning::failed to set ADMIN_TOKEN"
          else
            echo "::warning::ADMIN_TOKEN secret not set — the admin panel runs in open mode"
          fi
        env:
          DISCORD_APPLY_WEBHOOK: ${{ secrets.DISCORD_APPLY_WEBHOOK }}
          DISCORD_PROBLEMS_WEBHOOK: ${{ secrets.DISCORD_PROBLEMS_WEBHOOK }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # Idempotent (IF NOT EXISTS). Fails softly on first runs before the D1
      # database exists; the owner then runs `wrangler d1 create bget-db` once
      # and pastes the database_id into wrangler.toml.
      - name: Apply D1 schema (idempotent)
        run: |
          npx wrangler d1 execute bget-db --file=drizzle/schema.sql --remote || {
            echo "::warning::D1 schema apply failed — create the database first: \`wrangler d1 create bget-db\`, then un-comment [[d1_databases]] in wrangler.toml with the printed database_id. The worker deploy is unaffected."
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  # Runs instead of `deploy` while credentials are missing, so a push to main
  # reports green with guidance rather than a misleading red X.
  deploy-skipped:
    name: deploy skipped (no credentials yet)
    if: ${{ secrets.CF_API_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: echo "::notice::Deploy skipped — set the CF_API_TOKEN repo secret (plus DISCORD_*_WEBHOOK and ADMIN_TOKEN) as described in README §10, then re-run this workflow."