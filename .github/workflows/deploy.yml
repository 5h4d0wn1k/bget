name: Deploy to Cloudflare Workers

# Production deploy: builds the Next.js site as a static export (`out/`) and
# publishes it to the existing `bget` Worker with wrangler. Cloudflare Workers
# is the only deploy path (GitHub Pages is retired).
#
# Before the owner sets the CF_API_TOKEN repo secret, the workflow skips the
# deploy and reports green with a notice, so main never shows a misleading red
# X. Secrets are only referenced in step-level env/if — the job-level `if`
# context cannot evaluate secrets in Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Credentials present?
        id: creds
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped — set the CF_API_TOKEN repo secret, then re-run this workflow."
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.present == 'yes'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.creds.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.present == 'yes'
        run: npm ci

      - name: Build (static export)
        if: steps.creds.outputs.present == 'yes'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.present == 'yes'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
