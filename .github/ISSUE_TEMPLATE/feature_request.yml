name: Feature request
description: Propose an improvement or a new page/section
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        BGET's site is intentionally small and plain — **quality over
        quantity**. Tell us what would genuinely help visitors or applicants,
        and why it earns its place.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is hard or missing today? Who is affected?
      placeholder: Visitors can't tell when applications are reviewed…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: Describe the change as concretely as you can.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Copy / content change
        - Visual or CSS change
        - New page or section
        - JavaScript behaviour
        - CI / tooling / docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why not.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this (see CONTRIBUTING.md)
