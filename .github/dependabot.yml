version: 2
updates:
  # Dependabot configuration for the bget-website project
  - package-ecosystem: "npm"
    directory: "/workspace/projects/personal projects/opensource projects/bget-website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "maintainer"
    labels:
      - "security"
      - "update"
