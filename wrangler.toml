# BGET — Cloudflare Workers deployment (static assets)
#
# The Next.js site is exported to plain static files in `out/` (see
# next.config.mjs `output: 'export'`) and served by the existing `bget` Worker
# through Cloudflare's static assets binding. There is no server code today;
# add a `main` script here if/when the site needs dynamic routes (forms, D1,
# etc.) — the assets binding continues to work alongside a script.

name = "bget"
compatibility_date = "2026-10-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
